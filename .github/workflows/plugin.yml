name: Media Hub plugin CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/activity/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: plugin/activity
      - run: npm run build
        working-directory: plugin/activity
      - name: Require the latest stable Jellyfin release
        env:
          GH_TOKEN: ${{ github.token }}
          DOTNET_NOLOGO: 'true'
        shell: bash
        run: |
          reviewed=$(dotnet msbuild plugin/src/Jellyfin.Plugin.MediaHub/Jellyfin.Plugin.MediaHub.csproj -nologo -getProperty:SupportedJellyfinReleaseTag)
          latest=$(gh api repos/jellyfin/jellyfin/releases/latest --jq .tag_name)
          test "$reviewed" = "$latest" || { echo 'Review/update the Jellyfin API, catalog ABI and companion SDK pins for the new stable release.'; exit 1; }
      - run: dotnet test plugin/tests/MediaHub.Tests/MediaHub.Tests.csproj -c Release --nologo -p:RequireActivityBundle=true -p:ContinuousIntegrationBuild=true
      - name: Check direct and transitive NuGet advisories
        shell: pwsh
        run: ./plugin/tools/Test-Dependencies.ps1
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: plugin/web
      - run: npm test
        working-directory: plugin/web
      - run: npm ci --ignore-scripts
        working-directory: plugin/activity
      - run: npm run build
        working-directory: plugin/activity
      - run: npm audit --omit=dev --audit-level=low
        working-directory: plugin/activity
