name: Tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    container: python:3.14-slim
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: activity/package-lock.json
      - run: npm ci
        working-directory: activity
      - run: npm test
        working-directory: activity
      - run: npm run build
        working-directory: activity
