name: Publish Jellyfin plugin repository
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable four-part preview version, e.g. 0.1.0.0'
        required: true
        default: '0.1.0.0'
  push:
    tags: ['plugin-v*']
permissions:
  contents: read
concurrency:
  group: media-hub-plugin-repository
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Require the latest stable Jellyfin release
        env:
          GH_TOKEN: ${{ github.token }}
          DOTNET_NOLOGO: 'true'
        shell: bash
        run: |
          reviewed=$(dotnet msbuild plugin/src/Jellyfin.Plugin.MediaHub/Jellyfin.Plugin.MediaHub.csproj -nologo -getProperty:SupportedJellyfinReleaseTag)
          latest=$(gh api repos/jellyfin/jellyfin/releases/latest --jq .tag_name)
          test "$reviewed" = "$latest" || { echo 'Review/update the Jellyfin API, catalog ABI and companion SDK pins for the new stable release.'; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/web/package-lock.json
      - name: Validate release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#plugin-v}}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
        working-directory: plugin/web
      - run: npm test
        working-directory: plugin/web
      - run: npm ci --ignore-scripts
        working-directory: plugin/activity
      - run: npm run build
        working-directory: plugin/activity
      - name: Test the bundled release-version assembly
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet test plugin/tests/MediaHub.Tests/MediaHub.Tests.csproj -c Release --nologo -p:RequireActivityBundle=true -p:Version="$RELEASE_VERSION" -p:AssemblyVersion="$RELEASE_VERSION" -p:FileVersion="$RELEASE_VERSION" -p:InformationalVersion="$RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
      - name: Check direct and transitive NuGet advisories
        shell: pwsh
        run: ./plugin/tools/Test-Dependencies.ps1
      - run: npm audit --omit=dev --audit-level=low
        working-directory: plugin/activity
      - name: Build release assembly
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build plugin/src/Jellyfin.Plugin.MediaHub/Jellyfin.Plugin.MediaHub.csproj -c Release --nologo -p:RequireActivityBundle=true -p:Version="$RELEASE_VERSION" -p:AssemblyVersion="$RELEASE_VERSION" -p:FileVersion="$RELEASE_VERSION" -p:InformationalVersion="$RELEASE_VERSION" -p:ContinuousIntegrationBuild=true -o plugin/artifacts/build
      - name: Build ZIP and preserve repository history
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Release assets are authoritative even if a previous Pages deployment failed.
          # API/download errors fail closed instead of silently replacing history.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.tag_name | startswith("plugin-v")) | .tag_name' > release-tags.txt
          previous=()
          if [[ -s release-tags.txt ]]; then
            latest=$(sort -V release-tags.txt | tail -n 1)
            gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir previous
            previous=(--previous previous/manifest.json)
          fi
          dotnet run --project plugin/tools/MediaHub.Packager -c Release -- --input plugin/artifacts/build --output plugin/artifacts/repository --metadata plugin/repository/plugin.json --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" "${previous[@]}"
      - name: Install isolated browser tooling
        run: npm install --prefix "$RUNNER_TEMP/mediahub-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.64.1 axe-core@4.14.0
      - name: Install test Chromium
        run: node "$RUNNER_TEMP/mediahub-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Download the reviewed test-only Private SyncPlay provider
        shell: bash
        run: |
          curl --fail --location --max-time 90 --output "$RUNNER_TEMP/PrivateSyncPlay-0.1.5.zip" https://github.com/someRandomDude-a/private-syncplay-groups/releases/download/v0.1.5/PrivateSyncPlay-0.1.5.zip
          echo "d467ba8f4122dcb015f80afac5c18bad02037200fcf727c3bff88d8ea0d2ea8a  $RUNNER_TEMP/PrivateSyncPlay-0.1.5.zip" | sha256sum --check -
      - name: Gate the exact ZIP on native lifecycle and browser smoke
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}/mediahub-acceptance
          MEDIAHUB_BROWSER_CHANNEL: chromium
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./plugin/tools/Test-ReleaseSmoke.ps1 -Package "plugin/artifacts/repository/Jellyfin.Plugin.MediaHub_$env:RELEASE_VERSION.zip" -Version $env:RELEASE_VERSION -PlaywrightModule "$env:RUNNER_TEMP/mediahub-browser/node_modules/playwright-core/index.mjs" -AxeFile "$env:RUNNER_TEMP/mediahub-browser/node_modules/axe-core/axe.min.js" -ProviderZip "$env:RUNNER_TEMP/PrivateSyncPlay-0.1.5.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-repository
          path: plugin/artifacts/repository
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-repository
          path: repository
      - name: Publish immutable preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: gh release create "plugin-v${RELEASE_VERSION}" "repository/Jellyfin.Plugin.MediaHub_${RELEASE_VERSION}.zip" repository/manifest.json repository/SHA256SUMS --target "$GITHUB_SHA" --title "Media Hub plugin preview ${RELEASE_VERSION}" --notes-file plugin/repository/RELEASE_NOTES.md --prerelease --latest=false
      - name: Download the published ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: gh release download "plugin-v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --pattern SHA256SUMS --dir published
      - name: Verify downloaded release bytes before catalog deployment
        run: sha256sum --check SHA256SUMS
        working-directory: published
  repository:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-repository
          path: repository
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: repository
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
